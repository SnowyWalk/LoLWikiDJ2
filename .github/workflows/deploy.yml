name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/lolwikidj

jobs:
  build:
    # EC2·시크릿 준비가 끝나면 저장소 Variables 에 DEPLOY_ENABLED=true 를 추가해 배포를 켠다.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            compose.yaml
            docker
      - name: Write .env and secrets
        run: |
          umask 077
          mkdir -p secrets
          cat > .env <<EOF
          APP_IMAGE=${{ env.IMAGE }}:${{ github.sha }}
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          TWITCH_CLIENT_ID=${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_SECRET=${{ secrets.TWITCH_SECRET }}
          DANBOORU_LOGIN=${{ secrets.DANBOORU_LOGIN }}
          DANBOORU_API_KEY=${{ secrets.DANBOORU_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/app/google-tts.json
          TOONATION_SESSION_ID=${{ secrets.TOONATION_SESSION_ID }}
          MASTER_IP=${{ secrets.MASTER_IP }}
          EOF
          echo '${{ secrets.GOOGLE_TTS_CREDENTIALS_JSON_B64 }}' | base64 -d > secrets/google-tts.json
      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "compose.yaml,docker,.env,secrets"
          target: ~/lolwikidj
      - name: Pull and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/lolwikidj
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            docker compose pull app
            docker compose up -d --remove-orphans
            for i in $(seq 1 30); do
              docker compose exec -T app wget -qO- http://127.0.0.1:3000/healthz && exit 0
              sleep 2
            done
            docker compose logs --tail=100 app
            exit 1
