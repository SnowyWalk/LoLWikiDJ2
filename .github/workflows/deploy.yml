name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/snowywalk/lolwikidj2

jobs:
  build:
    # 저장소 Variables 에 DEPLOY_ENABLED=true 가 있을 때만 배포한다.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 서버(메모리 2GB, 다른 서비스와 공유)에서 빌드하지 않고 여기서 빌드한다.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_DIR: dj2
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: compose.yaml
          sparse-checkout-cone-mode: false
      - name: Write .env and secrets
        run: |
          umask 077
          mkdir -p secrets
          cat > .env <<EOF
          APP_IMAGE=${{ env.IMAGE }}:${{ github.sha }}
          TRUST_PROXY_HOPS=2
          DB_HOST=${{ vars.DB_HOST }}
          DB_PORT=${{ vars.DB_PORT || '3306' }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ vars.DB_NAME || 'LoLWikiDJ_DB' }}
          TWITCH_CLIENT_ID=${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_SECRET=${{ secrets.TWITCH_SECRET }}
          DANBOORU_LOGIN=${{ secrets.DANBOORU_LOGIN }}
          DANBOORU_API_KEY=${{ secrets.DANBOORU_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/app/google-tts.json
          TOONATION_SESSION_ID=${{ secrets.TOONATION_SESSION_ID }}
          MASTER_IP=${{ secrets.MASTER_IP }}
          EOF
          printf '%s' '${{ secrets.GOOGLE_TTS_CREDENTIALS_JSON_B64 }}' | base64 -d > secrets/google-tts.json
      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ vars.EC2_HOST }}" >> ~/.ssh/known_hosts
      - name: Upload compose and env
        run: |
          SSH="ssh -i ~/.ssh/deploy_key ${{ vars.EC2_USER }}@${{ vars.EC2_HOST }}"
          $SSH "mkdir -p ~/$DEPLOY_DIR/secrets && chmod 700 ~/$DEPLOY_DIR/secrets"
          scp -i ~/.ssh/deploy_key compose.yaml .env "${{ vars.EC2_USER }}@${{ vars.EC2_HOST }}:~/$DEPLOY_DIR/"
          scp -i ~/.ssh/deploy_key secrets/google-tts.json "${{ vars.EC2_USER }}@${{ vars.EC2_HOST }}:~/$DEPLOY_DIR/secrets/"
      - name: Pull and restart
        run: |
          ssh -i ~/.ssh/deploy_key "${{ vars.EC2_USER }}@${{ vars.EC2_HOST }}" bash -s <<EOF
          set -e
          cd ~/$DEPLOY_DIR
          chmod 600 .env
          # 이 잡 동안만 유효한 토큰으로 GHCR 에서 이미지를 받고 바로 로그아웃한다.
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker compose pull app
          docker logout ghcr.io
          docker compose up -d --remove-orphans
          for i in \$(seq 1 30); do
            if docker exec dj2 wget -qO- http://127.0.0.1:3000/healthz; then
              docker image prune -f >/dev/null
              exit 0
            fi
            sleep 2
          done
          docker compose logs --tail=100 app
          exit 1
          EOF
