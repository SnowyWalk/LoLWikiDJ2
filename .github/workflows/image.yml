name: Image

# 서버(메모리 2GB, 여러 앱 공유)에서 Next 빌드를 하면 메모리가 바닥나 서버 전체가 멈춘다 (2026-10-16 장애).
# 그래서 이미지는 여기서 빌드해 GHCR 에 올리고, 서버는 scripts/deploy.sh 로 받기만 한다.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/snowywalk/lolwikidj2:latest
            ghcr.io/snowywalk/lolwikidj2:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # 서버에 GHCR 로그인이 없어도 배포할 수 있게 이미지 파일도 남긴다 (scripts/deploy-via-artifact.sh)
      - name: Save image as artifact
        run: |
          docker pull ghcr.io/snowywalk/lolwikidj2:${{ github.sha }}
          docker save ghcr.io/snowywalk/lolwikidj2:${{ github.sha }} | gzip -1 > dj2-image.tar.gz
          ls -la dj2-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: dj2-image-${{ github.sha }}
          path: dj2-image.tar.gz
          retention-days: 3
          compression-level: 0
