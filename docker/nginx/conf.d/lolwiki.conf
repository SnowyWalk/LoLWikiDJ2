# 80: 인증서 갱신 + https 리다이렉트
server {
  listen 80;
  server_name lolwiki.xyz;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

ssl_certificate     /etc/letsencrypt/live/lolwiki.xyz/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/lolwiki.xyz/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:SSL:10m;

# 443: 실제 서비스. 채널은 경로로 구분한다. ("/" = 기본 채널, "/1004" = 1004 채널)
server {
  listen 443 ssl;
  http2 on;
  server_name lolwiki.xyz;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";

  location /socket.io/ {
    proxy_pass http://app;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
  }

  # Next 빌드 산출물: 파일명에 해시가 있으므로 영구 캐시
  location /_next/static/ {
    proxy_pass http://app;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    proxy_pass http://app;
  }
}

# 예전 포트 주소(lolwiki.xyz:1004)로 들어온 사용자를 새 주소(lolwiki.xyz/1004)로 보낸다.
# 북마크가 다 바뀌고 나면 이 블록과 해당 포트들을 지워도 된다.
map $server_port $legacy_channel_path {
  8080    /;
  default /$server_port;
}

server {
  listen 1004 ssl;
  listen 1111 ssl;
  listen 1128 ssl;
  listen 1224 ssl;
  listen 1337 ssl;
  listen 1557 ssl;
  listen 2250 ssl;
  listen 3939 ssl;
  listen 4010 ssl;
  listen 49415 ssl;
  listen 5599 ssl;
  listen 8080 ssl;
  listen 8081 ssl;
  listen 8082 ssl;
  listen 8083 ssl;
  server_name lolwiki.xyz;

  return 301 https://lolwiki.xyz$legacy_channel_path;
}
