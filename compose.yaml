name: dj2

# snowywalk.me 서버의 다른 앱들과 같은 방식:
#   서버에서 git pull → docker compose up -d --build
#   포트를 열지 않고 외부 네트워크 `proxy` 에 붙으면,
#   nginx-proxy-manager 가 dj2.snowywalk.me → http://dj2:3000 으로 전달한다.

services:
  app:
    build: .
    image: dj2:local
    container_name: dj2
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"
    volumes:
      - app-data:/data
      - ./secrets:/run/secrets/app:ro
    networks:
      - proxy
    # 메모리 2GB 서버를 다른 서비스와 같이 쓰므로 상한을 둔다.
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  proxy:
    external: true

volumes:
  app-data:
