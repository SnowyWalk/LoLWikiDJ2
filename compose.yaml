name: dj2

# EC2(snowywalk.me 서버)에서는 nginx-proxy-manager(NPM)가 80/443과 TLS를 맡는다.
# 이 앱은 포트를 열지 않고 NPM과 같은 외부 네트워크 `proxy` 에 붙으며,
# NPM 프록시 호스트가 dj2.snowywalk.me → http://dj2:3000 으로 전달한다.

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/snowywalk/lolwikidj2:latest}
    build: .
    container_name: dj2
    restart: unless-stopped
    env_file: .env
    volumes:
      - app-data:/data
      - ./secrets:/run/secrets/app:ro
    networks:
      - proxy
    # 메모리 2GB 서버를 다른 서비스와 같이 쓰므로 상한을 둔다.
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  proxy:
    external: true

volumes:
  app-data:
