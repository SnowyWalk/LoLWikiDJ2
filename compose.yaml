name: lolwikidj

# DB는 EC2 호스트에서 이미 돌고 있는 MySQL을 그대로 쓴다.
# 그래서 app/nginx 는 host 네트워크로 띄워 호스트의 localhost:3306 에 지금과 똑같이 접속한다.
# (MySQL bind-address, 계정 권한을 바꿀 필요가 없다)

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/snowywalk/lolwikidj:latest}
    build: .
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      # host 네트워크이므로 외부에 직접 노출되지 않도록 루프백에만 바인딩한다.
      HOST: 127.0.0.1
      PORT: 3000
    volumes:
      - app-data:/data
      - ./secrets:/run/secrets/app:ro
    logging: *logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    network_mode: host
    depends_on:
      - app
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    logging: *logging

volumes:
  app-data:
